<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Work Desk</title>
<meta name="description" content="Daily updates, case ATR follow-ups, bulletin items, posts and tasks. Works offline.">
<meta name="theme-color" id="metaTheme" content="#F4F5F9">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=JSON.parse(localStorage.getItem('mwd.theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone column under a glass app bar; Today opens on an ink-navy hero with a marigold progress ring; content in soft cards; floating dock + extended FAB; bottom sheets for every form */
:root{
  --bg:#F4F5F9; --surface:#FFFFFF; --surface-2:#EEF0F6; --raise:#FFFFFF; --line:#E2E5EE; --ink:#0F1324; --muted:#5F6679; --faint:#979DB0;
  --accent:#2F44D6; --accent-ink:#2536B8; --accent-soft:#E8EBFD; --on-accent:#FFFFFF;
  --hero-1:#11173A; --hero-2:#1F2C70; --hero-ink:#FFFFFF; --hero-muted:rgba(255,255,255,.72); --hero-cell:rgba(255,255,255,.09); --hero-hot:#FF9E92; --hero-warm:#FFD58C; --hero-calm:#9FE3C1; --marigold:#F6A623;
  --ok:#138A53; --ok-soft:#E2F5EB; --danger:#D42F22; --danger-soft:#FDEBE9; --on-danger:#FFFFFF; --warn:#A35F00; --warn-soft:#FFF1D9;
  --violet:#6B3FD0; --violet-soft:#EFE9FC; --teal:#0E7781; --teal-soft:#DFF3F4;
  --toast-act:#A9B4FF; --knob:#FFFFFF;
  --shadow-1:0 1px 2px rgba(15,19,36,.05),0 4px 16px rgba(15,19,36,.05);
  --shadow-2:0 12px 32px rgba(15,19,36,.16);
  --scrim:rgba(10,12,22,.42); --glass:rgba(244,245,249,.82); --dock-glass:rgba(255,255,255,.86);
  --av0-bg:#E6E9FD;--av0-fg:#2F44D6; --av1-bg:#DAF2EF;--av1-fg:#0E6F64; --av2-bg:#FCE4EA;--av2-fg:#B0224A;
  --av3-bg:#FFEFD3;--av3-fg:#8F5300; --av4-bg:#EEE6FC;--av4-fg:#6234C8; --av5-bg:#E1F3E4;--av5-fg:#1D7034;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-card:20px; --r-ctl:14px; --bar-h:56px; --dock-h:66px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#090B12; --surface:#141824; --surface-2:#1C2131; --raise:#2A3046; --line:#262C3E; --ink:#ECEEF6; --muted:#A0A6B9; --faint:#6E758B;
    --accent:#8D9BFF; --accent-ink:#AEB8FF; --accent-soft:#1F2547; --on-accent:#0A0C14;
    --hero-1:#141A3E; --hero-2:#25317A; --hero-cell:rgba(255,255,255,.08);
    --ok:#53D394; --ok-soft:#10291F; --danger:#FF7A6C; --danger-soft:#361715; --on-danger:#1A0806; --warn:#FFB54D; --warn-soft:#33240D;
    --violet:#B69BFF; --violet-soft:#251C40; --teal:#5BCFD8; --teal-soft:#0F2A2D;
    --toast-act:#2F44D6; --knob:#F4F5F9;
    --shadow-1:0 0 0 1px rgba(255,255,255,.045); --shadow-2:0 16px 40px rgba(0,0,0,.55);
    --scrim:rgba(0,0,0,.6); --glass:rgba(9,11,18,.82); --dock-glass:rgba(24,28,42,.88);
    --av0-bg:#232A55;--av0-fg:#B4BEFF; --av1-bg:#123331;--av1-fg:#7FDCCD; --av2-bg:#3A1A25;--av2-fg:#FF9DB6;
    --av3-bg:#3A2A10;--av3-fg:#FFC870; --av4-bg:#2A1F4A;--av4-fg:#C9B2FF; --av5-bg:#14301B;--av5-fg:#8BDE9E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090B12; --surface:#141824; --surface-2:#1C2131; --raise:#2A3046; --line:#262C3E; --ink:#ECEEF6; --muted:#A0A6B9; --faint:#6E758B;
  --accent:#8D9BFF; --accent-ink:#AEB8FF; --accent-soft:#1F2547; --on-accent:#0A0C14;
  --hero-1:#141A3E; --hero-2:#25317A; --hero-cell:rgba(255,255,255,.08);
  --ok:#53D394; --ok-soft:#10291F; --danger:#FF7A6C; --danger-soft:#361715; --on-danger:#1A0806; --warn:#FFB54D; --warn-soft:#33240D;
  --violet:#B69BFF; --violet-soft:#251C40; --teal:#5BCFD8; --teal-soft:#0F2A2D;
  --toast-act:#2F44D6; --knob:#F4F5F9;
  --shadow-1:0 0 0 1px rgba(255,255,255,.045); --shadow-2:0 16px 40px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.6); --glass:rgba(9,11,18,.82); --dock-glass:rgba(24,28,42,.88);
  --av0-bg:#232A55;--av0-fg:#B4BEFF; --av1-bg:#123331;--av1-fg:#7FDCCD; --av2-bg:#3A1A25;--av2-fg:#FF9DB6;
  --av3-bg:#3A2A10;--av3-fg:#FFC870; --av4-bg:#2A1F4A;--av4-fg:#C9B2FF; --av5-bg:#14301B;--av5-fg:#8BDE9E;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
[aria-invalid="true"]{border-color:var(--danger)!important}
svg{flex:none}

/* app bar */
.appbar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background-color .2s,box-shadow .2s}
.appbar.scrolled{background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);box-shadow:0 1px 0 var(--line)}
.appbar-in{max-width:600px;margin:0 auto;height:var(--bar-h);padding:0 8px 0 16px;display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px}
.mark .m-bg{fill:var(--accent)} .mark .m-page{fill:var(--on-accent)} .mark .m-clip{fill:var(--marigold)} .mark .m-tick{stroke:var(--accent)}
.bar-titles{flex:1;min-width:0;position:relative;height:24px}
.bar-titles span{position:absolute;inset:0;font:700 17px/24px var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s,transform .2s}
.bar-title{opacity:0;transform:translateY(6px)}
.scrolled .bar-brand{opacity:0;transform:translateY(-6px)}
.scrolled .bar-title{opacity:1;transform:none}
.iconbtn{background:none;border:0;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--ink);flex:none;padding:0}
.iconbtn:active{background:var(--surface-2)}

.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:6px calc(var(--dock-h) + 120px + env(safe-area-inset-bottom,0px))}
#view{display:grid;gap:26px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:16px;padding:12px 14px;font-size:14.5px;font-weight:500;margin-bottom:16px}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}

/* large titles */
.lhead{display:grid;gap:4px;padding-top:2px}
.ltitle{font:800 34px/1.05 var(--f-display);letter-spacing:-.025em;margin:0}
.lsub{margin:0;color:var(--muted);font-size:15px;font-variant-numeric:tabular-nums}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 16px;color:var(--hero-ink);display:grid;gap:18px;box-shadow:var(--shadow-2);
  background:radial-gradient(circle at 100% 0%,rgba(246,166,35,.32),transparent 44%),radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.4px) 0 0/14px 14px,linear-gradient(150deg,var(--hero-1),var(--hero-2))}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:14px}
.hero-eyebrow{margin:0;font:700 11.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted)}
.hero-title{margin:10px 0 6px;font:800 30px/1.02 var(--f-display);letter-spacing:-.025em;text-wrap:balance}
.hero-sub{margin:0;color:var(--hero-muted);font-size:15px;line-height:1.35}
.ring{position:relative;width:88px;height:88px;flex:none;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .trk{stroke:rgba(255,255,255,.14)}
.ring .arc{stroke:var(--marigold);stroke-linecap:round}
.ring-c{position:relative;display:grid;justify-items:center;line-height:1}
.ring-c b{font:800 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.ring-c span{margin-top:4px;font:700 9.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--hero-muted)}
.hero-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero-stats button{background:var(--hero-cell);border:0;border-radius:16px;padding:11px 10px 10px;color:inherit;text-align:left;display:grid;gap:5px;min-width:0;transition:background .15s,transform .12s}
.hero-stats button:active{transform:scale(.96);background:rgba(255,255,255,.16)}
.hero-stats b{font:800 23px/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--hero-calm)}
.hero-stats .hot b{color:var(--hero-hot)} .hero-stats .warm b{color:var(--hero-warm)}
.hero-stats span{font-size:11.5px;line-height:1.2;color:var(--hero-muted);font-weight:500}

/* sections & cards */
.sec{display:grid;gap:12px;scroll-margin-top:calc(var(--bar-h) + 16px)}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-height:30px;padding:0 2px}
.sec-h h2{margin:0;font:750 19px/1.2 var(--f-display);letter-spacing:-.015em}
.meta{font-size:13.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.hint{margin:0;font-size:13.5px;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-1);overflow:hidden}
.list > * + *{box-shadow:inset 0 1px 0 var(--line)}
.stack{display:grid;gap:10px}
.card-foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}

/* notices */
.notice{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-card);background:var(--surface);box-shadow:var(--shadow-1)}
.n-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.notice.warn .n-ic{background:var(--warn-soft);color:var(--warn)}
.notice h3{margin:2px 0 4px;font:750 16.5px/1.25 var(--f-display);letter-spacing:-.01em}
.notice p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.notice ol{margin:0 0 12px;padding-left:18px;color:var(--muted);font-size:14.5px;display:grid;gap:4px}
.n-body{min-width:0;flex:1}

/* avatars & people */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;font:700 calc(var(--s)*.36)/1 var(--f-body);letter-spacing:.02em;flex:none;position:relative;user-select:none}
.people{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:6px 16px 4px;scroll-snap-type:x proximity}
.people::-webkit-scrollbar{display:none}
.person{flex:none;width:78px;display:grid;justify-items:center;gap:7px;background:none;border:0;padding:4px 0;scroll-snap-align:start;color:inherit;border-radius:16px;transition:transform .12s}
.person:active{transform:scale(.94)}
.person .av{--s:58px;box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--ring,var(--line))}
.person.got{--ring:var(--ok)} .person.asked{--ring:var(--warn)} .person.none{--ring:var(--faint)}
.bd{position:absolute;right:-5px;bottom:-5px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--bg);background:var(--surface-2);color:var(--muted)}
.person.got .bd{background:var(--ok);color:var(--on-accent)} .person.asked .bd{background:var(--warn);color:var(--on-accent)}
.pname{font-size:13px;font-weight:650;max-width:76px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.pstat{font-size:11.5px;color:var(--muted);margin-top:-5px;font-weight:500}
.person.got .pstat{color:var(--ok)} .person.asked .pstat{color:var(--warn)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--ok);transition:width .4s ease}

/* update rows */
.urow{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;background:none;border:0;text-align:left;color:inherit;transition:background .15s}
.urow:active{background:var(--surface-2)}
.ubody{flex:1;min-width:0;display:grid;gap:4px}
.uhead{display:flex;align-items:center;gap:8px;min-width:0}
.uhead b{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uhead time{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.utext{font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.clamp2,.clamp3{overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical}
.clamp2{-webkit-line-clamp:2} .clamp3{-webkit-line-clamp:3}
.num{width:28px;height:28px;border-radius:9px;background:var(--accent-soft);color:var(--accent-ink);font:600 13px/28px var(--f-mono);text-align:center;flex:none}
.st{font:700 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:4px 7px;border-radius:6px;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)} .st.mut{background:var(--surface-2);color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font:650 11.5px/1 var(--f-body);padding:5px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.tag.bulletin{background:var(--accent-soft);color:var(--accent-ink)} .tag.report{background:var(--violet-soft);color:var(--violet)}
.tag.post{background:var(--teal-soft);color:var(--teal)} .tag.task{background:var(--warn-soft);color:var(--warn)}
.day{position:sticky;top:calc(var(--bar-h) + env(safe-area-inset-top,0px));z-index:5;justify-self:start;font:750 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:10px 2px 6px;margin-bottom:-4px}

/* tappable cards with inner buttons */
.ccard,.pcard{position:relative;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-1);padding:14px 16px;display:grid;gap:8px;transition:transform .12s}
.ccard:has(.hit:active),.pcard:has(.hit:active){transform:scale(.985)}
.hit{position:absolute;inset:0;z-index:0;border:0;background:none;border-radius:inherit;padding:0}
.ccard > :not(.hit),.pcard > :not(.hit){position:relative;z-index:1;pointer-events:none}
.live{pointer-events:auto}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cno{font:500 12.5px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.02em}
.ctitle{margin:0;font:700 16.5px/1.3 var(--f-body);overflow-wrap:anywhere}
.cmeta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:13.5px}
.cmeta span{display:inline-flex;align-items:center;gap:5px;min-width:0}
.cfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:10px;margin-top:2px;border-top:1px dashed var(--line);font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stamp{font:600 10.5px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border:1.5px solid currentColor;border-radius:5px;white-space:nowrap;flex:none}
.stamp.late{color:var(--danger);background:var(--danger-soft);transform:rotate(-2.5deg)}
.stamp.wait{color:var(--warn);background:var(--warn-soft)}
.stamp.ok{color:var(--ok);background:var(--ok-soft)}
.stamp.muted{color:var(--muted)}
.p-head{display:flex;align-items:center;gap:10px}
.p-who{flex:1;min-width:0;display:grid;line-height:1.25}
.p-who b{font-size:15px} .p-who small{font-size:12.5px;color:var(--muted)}
.p-who em,.tchips em{font-style:normal;font-weight:650}
em.late{color:var(--danger)} em.today{color:var(--warn)}
.pst{font:700 11px/1 var(--f-body);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.pst.draft{background:var(--violet-soft);color:var(--violet)} .pst.approved{background:var(--accent-soft);color:var(--accent-ink)} .pst.posted{background:var(--ok-soft);color:var(--ok)}
.ptext{margin:0;font-size:15px;line-height:1.5;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.p-foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{font:500 12.5px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--danger)}

/* tasks */
.trow{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.check{width:26px;height:26px;margin-top:1px;border-radius:50%;border:2px solid var(--faint);background:none;display:grid;place-items:center;flex:none;padding:0;color:transparent;transition:background .2s,border-color .2s,transform .15s}
.check svg path{stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .28s .05s ease}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.check[aria-pressed="true"] svg path{stroke-dashoffset:0}
.check:active{transform:scale(.86)}
.tmain{flex:1;min-width:0;display:grid;gap:6px;background:none;border:0;padding:2px 0;text-align:left;color:inherit}
.ttitle{font-size:15.5px;font-weight:600;line-height:1.35;overflow-wrap:anywhere;transition:color .2s}
.ttitle.done{text-decoration:line-through;color:var(--muted)}
.trow.leaving .ttitle{color:var(--muted);text-decoration:line-through}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.due,.who{display:inline-flex;align-items:center;gap:4px;font:650 12px/1 var(--f-body);padding:4px 8px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.due.late{background:var(--danger-soft);color:var(--danger)} .due.today{background:var(--warn-soft);color:var(--warn)}
.who{padding:2px 8px 2px 2px;border-radius:999px}

/* buttons, chips, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-ctl);padding:14px 18px;font:700 16px/1 var(--f-body);white-space:nowrap;transition:transform .12s,background-color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.tonal{background:var(--accent-soft);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn.grow{flex:1}
.btn[disabled]{opacity:.55}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.more{background:none;border:0;color:var(--accent-ink);font-weight:700;padding:6px 2px;justify-self:start}
.toolbar{display:grid;gap:12px}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:48px;border-radius:16px;border:1.5px solid transparent;background:var(--surface);box-shadow:var(--shadow-1);padding:0 14px 0 44px;font-size:16px}
.search input:focus{outline:none;border-color:var(--accent)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font:650 14px/1.15 var(--f-body);color:var(--muted);transition:background-color .15s,color .15s,border-color .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-variant-numeric:tabular-nums;opacity:.65}
.chips.pick .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip.withav{padding:3px 12px 3px 3px}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg-b{flex:1;border:0;background:none;border-radius:10px;padding:10px 6px;font:650 14px/1.1 var(--f-body);color:var(--muted);min-width:0;transition:background-color .15s,color .15s}
.seg-b[aria-pressed="true"]{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(15,19,36,.12)}
.seg.mini{flex:none;padding:3px;border-radius:12px}
.seg.mini .seg-b{padding:6px 11px;font-size:13px;border-radius:9px}
.field{display:grid;gap:8px;min-width:0}
.lbl{font:650 13px/1.2 var(--f-body);color:var(--muted)}
.inp,.sheet textarea,.sheet input[type="date"],.sheet select{width:100%;min-width:0;min-height:50px;padding:12px 14px;border:1.5px solid transparent;border-radius:14px;background:var(--surface-2);font-size:16px;line-height:1.4;transition:border-color .15s,background-color .15s}
.inp:focus,.sheet textarea:focus,.sheet input[type="date"]:focus,.sheet select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.sheet textarea{resize:vertical;min-height:96px}
.sheet input[type="file"]{width:100%;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.inline{display:flex;gap:8px;align-items:center}
.inline .inp{flex:1}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:14px;font-weight:600}
.srow small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.switch{appearance:none;-webkit-appearance:none;position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);margin:0;flex:none;cursor:pointer;transition:background-color .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch:checked{background:var(--ok)}
.switch:checked::after{transform:translateX(18px)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;gap:12px;font-size:14.5px}
.hist .d{font:500 12px/1.9 var(--f-mono);color:var(--muted);flex:none;min-width:44px}

/* empty states */
.empty-st{display:grid;justify-items:center;text-align:center;gap:6px;padding:28px 20px 26px}
.es-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}
.empty-st b{font:750 16.5px/1.25 var(--f-display)}
.empty-st p{margin:0;color:var(--muted);font-size:14.5px;max-width:300px}
.empty-st .btn{margin-top:10px}
.mini-empty{display:flex;align-items:center;gap:12px;padding:16px;color:var(--muted);font-size:14.5px}
.mini-empty .es-ic{width:36px;height:36px;border-radius:12px;margin:0;flex:none;background:var(--ok-soft);color:var(--ok)}

/* dock + fab */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock-in{pointer-events:auto;max-width:520px;margin:0 auto;height:var(--dock-h);background:var(--dock-glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-radius:24px;box-shadow:0 8px 28px rgba(15,19,36,.14),inset 0 0 0 1px var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px}
.dock button{border:0;background:none;display:grid;justify-items:center;align-content:center;gap:4px;color:var(--muted);font:650 11px/1 var(--f-body);position:relative;padding:0;border-radius:18px}
.dock .ind{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s,color .2s,transform .2s}
.dock button[aria-current="page"]{color:var(--ink)}
.dock button[aria-current="page"] .ind{background:var(--accent-soft);color:var(--accent-ink)}
.dock button:active .ind{transform:scale(.9)}
.bdg{position:absolute;top:0;left:calc(50% + 9px);min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:var(--on-danger);font:700 11px/18px var(--f-body);padding:0 5px;font-variant-numeric:tabular-nums;box-shadow:0 0 0 2px var(--surface)}
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 284px));bottom:calc(var(--dock-h) + 22px + env(safe-area-inset-bottom,0px));height:56px;min-width:56px;padding:0 20px 0 16px;border:0;border-radius:18px;background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15.5px/1 var(--f-body);box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 42%,transparent);transition:padding .22s,gap .22s,transform .12s}
.fab .fl{max-width:160px;overflow:hidden;white-space:nowrap;transition:max-width .25s,opacity .2s}
.fab.mini{padding:0 16px;gap:0}
.fab.mini .fl{max-width:0;opacity:0}
.fab:active{transform:scale(.95)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .22s ease both;transition:opacity .2s}
.sheet{position:relative;width:100%;max-width:600px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:0 18px;display:grid;gap:18px;align-content:start;animation:sheetUp .34s cubic-bezier(.2,.9,.25,1) both;transition:transform .25s cubic-bezier(.2,.9,.25,1)}
.sheet-wrap.closing .sheet{transform:translateY(105%)!important;transition:transform .2s ease-in}
.sheet-wrap.closing .scrim{opacity:0}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.sh-drag{position:sticky;top:0;z-index:3;background:var(--surface);padding:10px 0 4px;touch-action:none;cursor:grab}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-head h2{margin:0;font:800 24px/1.15 var(--f-display);letter-spacing:-.02em}
.sh-person{display:flex;align-items:center;gap:12px}
.sh-person b{display:block;font:800 22px/1.15 var(--f-display);letter-spacing:-.015em}
.sh-person small{color:var(--muted);font-size:13.5px}
.actions{position:sticky;bottom:0;z-index:3;display:flex;gap:10px;align-items:center;background:var(--surface);padding:12px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:2px;box-shadow:0 -1px 0 var(--line)}
.actions .btn.primary{flex:1}
.sheet-end{height:calc(10px + env(safe-area-inset-bottom,0px))}
.alist{display:grid;gap:8px}
.arow{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:0;border-radius:16px;background:var(--surface-2);text-align:left;color:inherit;transition:transform .12s}
.arow:active{transform:scale(.98)}
.arow b{display:block;font-size:15.5px}
.arow small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.arow .a-ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--accent);flex:none}
.arow.pri{background:var(--accent);color:var(--on-accent)}
.arow.pri small{color:var(--on-accent);opacity:.78}
.arow.pri .a-ic{background:rgba(255,255,255,.18);color:var(--on-accent)}
.arow[aria-current="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.group{display:grid;gap:10px}
.group-t{font:750 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px 0}
.pplrows{display:grid;gap:10px}
.pplrow{display:grid;gap:10px;padding:12px;border-radius:16px;background:var(--surface-2)}
.pplrow .inp{background:var(--surface)}
.pplrow-b{display:flex;align-items:center;gap:10px}
.pplrow-b select{width:auto;flex:1;background:var(--surface)!important}
.pplrow-b label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.copybox{width:100%;min-height:220px;font:13px/1.5 var(--f-mono)}
.status-line{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;font-weight:600;font-size:14.5px;background:var(--ok-soft);color:var(--ok)}
.status-line.warn{background:var(--warn-soft);color:var(--warn)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--dock-h) + 26px + env(safe-area-inset-bottom,0px));z-index:60;transform:translate(-50%,18px);opacity:0;pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.2,.9,.25,1);background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:14px;font:650 14.5px/1.3 var(--f-body);width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow-2)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast.bad{background:var(--danger);color:var(--on-danger)}
.t-undo{border:0;background:none;color:var(--toast-act);font:800 14.5px/1 var(--f-body);padding:6px 4px;letter-spacing:.02em}

/* motion */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.enter > *{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.enter > :nth-child(2){animation-delay:.04s} .enter > :nth-child(3){animation-delay:.08s} .enter > :nth-child(4){animation-delay:.12s}
.enter > :nth-child(5){animation-delay:.16s} .enter > :nth-child(6){animation-delay:.2s} .enter > :nth-child(n+7){animation-delay:.24s}
.enter .ring .arc{animation:ring 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
@media (prefers-reduced-motion:reduce){
  .enter > *,.enter .ring .arc,.sheet,.scrim{animation:none!important}
  .toast,.fab,.fab .fl,.check,.check svg path,.sheet,.bar-titles span{transition:none!important}
}
</style>
</head>

<header class="appbar" id="appbar">
  <div class="appbar-in">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="m-bg" width="32" height="32" rx="9"/><rect class="m-page" x="9.6" y="8" width="12.8" height="17" rx="1.8"/><rect class="m-clip" x="13.1" y="6.4" width="5.8" height="2.9" rx="1.1"/><path class="m-tick" d="m12.5 17 2.6 2.6 4.9-5.8" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="bar-titles"><span class="bar-brand">My Work Desk</span><span class="bar-title" id="barTitle">Today</span></div>

  </div>
</header>
<div class="wrap">

  <main id="view"><div class="card"><div class="mini-empty">Loading your data…</div></div></main>
</div>

</div>
<div id="toast" class="toast" role="status" aria-live="polite"><span id="tMsg"></span><button type="button" class="t-undo" id="tUndo" data-act="undo" hidden>UNDO</button></div>

<script>
(function(){
'use strict';
const APP_VERSION='2.0';
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const GROUPS={team:'Team',alliance:'Alliance',senior:'Senior'};
const CAT={appdev:'App dev',office:'Office',other:'Other'};
const PSTAT={idea:'Idea',draft:'Draft',approved:'Approved',posted:'Posted'};
const TABS=[['aaj','Today'],['updates','Updates'],['cases','Cases'],['posts','Posts'],['tasks','Tasks']];
const FABL={aaj:'New update',updates:'New update',cases:'New case',posts:'New post',tasks:'New task'};
const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=ms=>{try{const ua=navigator.userActivation;if(navigator.vibrate&&(!ua||ua.hasBeenActive))navigator.vibrate(ms||8);}catch(e){}};

/* ---------- local database: IndexedDB on this phone ---------- */
const LocalDB=(function(){
  const NAME='my-work-desk',STORE='docs';
  let idb=null;const mem=new Map();const subs=new Set();
  const clone=o=>JSON.parse(JSON.stringify(o));
  const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
  const done=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('aborted'));});
  async function init(){
    if(!('indexedDB' in window))throw new Error('IndexedDB missing');
    idb=await new Promise((res,rej)=>{
      const r=indexedDB.open(NAME,1);
      r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE);};
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
    });
    const st=idb.transaction(STORE,'readonly').objectStore(STORE);
    const [keys,vals]=await Promise.all([req(st.getAllKeys()),req(st.getAll())]);
    keys.forEach((k,i)=>mem.set(k,vals[i]));
  }
  async function commit(entries){
    const tx=idb.transaction(STORE,'readwrite'),st=tx.objectStore(STORE);
    entries.forEach(([p,v])=>{if(v===undefined)st.delete(p);else st.put(v,p);});
    try{await done(tx);}catch(e){throw{code:e&&e.name==='QuotaExceededError'?'quota_exceeded':'unavailable',message:String(e&&e.message||e)};}
    entries.forEach(([p,v])=>{if(v===undefined)mem.delete(p);else mem.set(p,v);});
    notify();
  }
  let queued=false;
  function notify(){if(queued)return;queued=true;Promise.resolve().then(()=>{queued=false;subs.forEach(f=>{try{f();}catch(e){console.error(e);}});});}
  function snap(path){const id=path.split('/').pop(),v=mem.get(path);return{id,exists:v!==undefined,data:()=>v};}
  const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  function listen(f){subs.add(f);Promise.resolve().then(f);return()=>subs.delete(f);}
  function docRef(path){return{id:path.split('/').pop(),path,
    get:async()=>snap(path),
    set:async d=>commit([[path,clone(d)]]),
    update:async d=>{const cur=mem.get(path);if(cur===undefined)throw{code:'invalid_argument',message:'missing document'};return commit([[path,Object.assign({},cur,clone(d))]]);},
    delete:async()=>commit([[path,undefined]]),
    onSnapshot:next=>listen(()=>next(snap(path)))};}
  function query(path,ord,lim){
    function run(){
      const pre=path+'/';let d=[];
      mem.forEach((v,k)=>{if(k.startsWith(pre)&&k.indexOf('/',pre.length)<0)d.push(snap(k));});
      if(ord){const f=ord[0],m=ord[1]==='desc'?-1:1;d.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return (x>y?1:x<y?-1:0)*m;});}
      if(lim)d=d.slice(0,lim);
      return{docs:d,size:d.length,empty:!d.length};
    }
    return{orderBy:(f,dir)=>query(path,[f,dir||'asc'],lim),limit:n=>query(path,ord,n),get:async()=>run(),onSnapshot:next=>listen(()=>next(run()))};
  }
  function colRef(path){return Object.assign(query(path),{path,doc:id=>docRef(path+'/'+(id||newId()))});}
  function dump(){const out={};mem.forEach((v,k)=>{const i=k.lastIndexOf('/');(out[k.slice(0,i)]=out[k.slice(0,i)]||[]).push(Object.assign({id:k.slice(i+1)},v));});return out;}
  return{init,doc:docRef,collection:colRef,bulk:entries=>commit(entries.map(([p,v])=>[p,v===undefined?undefined:clone(v)])),dump};
})();

/* ---------- dates (local calendar days as YYYY-MM-DD) ---------- */
const pad=n=>String(n).padStart(2,'0');
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
const isD=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s);
function ms(s){const a=s.split('-').map(Number);return Date.UTC(a[0],a[1]-1,a[2]);}
function diff(a,b){return Math.round((ms(b)-ms(a))/864e5);}
function addDays(s,n){return new Date(ms(s)+n*864e5).toISOString().slice(0,10);}
function fmtD(s){if(!isD(s))return '';const d=new Date(ms(s));return d.getUTCDate()+' '+MON[d.getUTCMonth()];}
function fmtLong(s){const d=new Date(ms(s));return d.getUTCDate()+' '+MONL[d.getUTCMonth()]+' '+d.getUTCFullYear();}
function dayTitle(s){const d=new Date(ms(s));return DAYS[d.getUTCDay()]+', '+d.getUTCDate()+' '+MON[d.getUTCMonth()];}
function dayLong(s){const d=new Date(ms(s));return DAYS[d.getUTCDay()]+', '+d.getUTCDate()+' '+MONL[d.getUTCMonth()];}
function relD(s){if(!isD(s))return '';const n=diff(S.today,s);if(n===0)return 'today';if(n===1)return 'tomorrow';if(n===-1)return 'yesterday';return fmtD(s);}
function groupLabel(s){if(!isD(s))return 'No date';const n=diff(s,S.today);if(n===0)return 'Today';if(n===1)return 'Yesterday';if(n<0)return 'Upcoming · '+fmtD(s);return dayTitle(s);}
function dueBits(s){if(!isD(s))return null;const n=diff(S.today,s);if(n<0)return{cls:'late',txt:(-n)+(n===-1?' day late':' days late')};if(n===0)return{cls:'today',txt:'Today'};if(n===1)return{cls:'',txt:'Tomorrow'};return{cls:'',txt:fmtD(s)};}
function fmtTime(t){if(!t)return '';try{return new Date(t).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}).replace(/\s?([ap])\.?m\.?/i,(m,x)=>' '+x.toLowerCase()+'m');}catch(e){return '';}}
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}

/* ---------- per-device conveniences ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('mwd.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('mwd.'+k,JSON.stringify(v));}catch(e){}}};

const S={today:todayStr(),tab:'aaj',ready:false,loaded:{},cases:[],updates:[],posts:[],tasks:[],config:null,checkin:{},lastBackup:'',anim:true,
  f:{u:'all',uq:'',c:'open',cq:'',p:'all',t:'all',bm:'bulletin',showDone:false,showPosted:false}};
const savedTab=LS.get('tab','aaj'); if(TABS.some(t=>t[0]===savedTab)) S.tab=savedTab;
Object.assign(S.f,LS.get('f',{}),{uq:'',cq:'',showDone:false,showPosted:false});
let db=null;
let installEvt=null;
const isInstalled=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;

/* ---------- theme ---------- */
function applyTheme(){
  const t=LS.get('theme','system'),r=document.documentElement;
  if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);
  $('#metaTheme').setAttribute('content',dark?'#090B12':'#F4F5F9');
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}

/* ---------- icons ---------- */
const IC={

/* ---------- config helpers ---------- */
function people(){return S.config&&Array.isArray(S.config.people)?S.config.people:[];}
function handles(){return S.config&&Array.isArray(S.config.handles)?S.config.handles:[];}
function personName(id,fallback){if(!id)return fallback||'';if(id==='self')return 'Me';const p=people().find(x=>x.id===id);return p?p.name:(fallback||'Other');}
function destOptions(){return [['bulletin','Bulletin'],['report','Report']].concat(handles().map(h=>['post:'+h,h+' post']),[['task','Task'],['record','Record only']]);}
function destLabel(d){d=String(d);if(d.startsWith('post:'))return d.slice(5)+' post';return({bulletin:'Bulletin',report:'Report',task:'Task',record:'Record'})[d]||d;}
const hasData=()=>S.cases.length+S.updates.length+S.posts.length+S.tasks.length>0;
const backupDue=()=>hasData()&&(!isD(S.lastBackup)||diff(S.lastBackup,S.today)>=7);
function lastBackupText(){if(!isD(S.lastBackup))return 'never';const n=diff(S.lastBackup,S.today);return n===0?'today':n===1?'yesterday':plural(n,'day')+' ago';}
function hue(s){let h=0;for(const ch of String(s))h=(h*31+ch.charCodeAt(0))>>>0;return h%6;}
function initials(n){const w=String(n||'?').trim().split(/\s+/).filter(Boolean);return(((w[0]||'?')[0]||'')+((w[1]||'')[0]||'')).toUpperCase();}
function avatar(id,name,size,text){const k=hue(id||name);return '<span class="av" style="--s:'+(size||40)+'px;background:var(--av'+k+'-bg);color:var(--av'+k+'-fg)" aria-hidden="true">'+esc(text||(id==='self'?'Me':initials(name)))+'</span>';}

/* ---------- derived state ---------- */
function caseState(c){
  if(c.closed)return{kind:'muted',label:'Closed'};
  if(c.atrStatus==='received')return{kind:'ok',label:'ATR received'};
  if(c.atrStatus==='na')return{kind:'muted',label:'No ATR needed'};
  const late=isD(c.atrDue)?diff(c.atrDue,S.today):null;
  if(late!==null&&late>0)return{kind:'late',label:'ATR late · '+late+'d'};
  return{kind:'wait',label:'ATR pending'};
}
function needsFollow(c){
  if(c.closed||c.atrStatus==='received'||c.atrStatus==='na')return false;
  if(isD(c.nextFollowup))return c.nextFollowup<=S.today;
  return isD(c.atrDue)&&c.atrDue<=S.today;
}
function byCaseUrgency(a,b){
  const fa=needsFollow(a)?0:1,fb=needsFollow(b)?0:1;if(fa!==fb)return fa-fb;
  const da=isD(a.atrDue)?a.atrDue:'9999',dbb=isD(b.atrDue)?b.atrDue:'9999';if(da!==dbb)return da<dbb?-1:1;
  return (b.createdAt||0)-(a.createdAt||0);
}
function byDue(a,b){const da=isD(a.due)?a.due:'9999',dbb=isD(b.due)?b.due:'9999';if(da!==dbb)return da<dbb?-1:1;if(!!a.urgent!==!!b.urgent)return a.urgent?-1:1;return (a.createdAt||0)-(b.createdAt||0);}
function byPost(a,b){const da=isD(a.date)?a.date:'9999',dbb=isD(b.date)?b.date:'9999';if(da!==dbb)return da<dbb?-1:1;return (a.createdAt||0)-(b.createdAt||0);}
function personToday(p){
  const n=S.updates.filter(u=>u.from===p.id&&u.date===S.today&&u.status!=='dropped').length;
  if(n)return{k:'got',label:plural(n,'update'),n};
  const m=(S.checkin.marks||{})[p.id];
  if(m==='asked')return{k:'asked',label:'Asked'};
  if(m==='none')return{k:'none',label:'Nothing today'};
  return{k:'pending',label:'Pending'};
}
function currentBulletin(){
  const bm=S.f.bm;
  return S.updates.filter(u=>(u.dest||[]).includes(bm)&&u.date===S.today&&u.status!=='dropped').sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
}
function openTasksDue(){return S.tasks.filter(x=>!x.done&&isD(x.due)&&x.due<=S.today);}
function stripId(o){const c=Object.assign({},o);delete c.id;return c;}

      '<li>Add the people you collect updates from.</li><li>Add your social media handles.</li><li>Moving from the old link? Use Import backup.</li></ol>'+

  }
  if(!isInstalled()&&!LS.get('hideInstall',false)){
    h+='<div class="notice"><span class="n-ic">'+ic('phone',22)+'</span><div class="n-body"><h3>Install on your phone</h3>'+
      (installEvt?'<p>Get a home-screen icon. It opens without internet.</p><div class="btnrow"><button type="button" class="btn sm primary" data-act="install">Install app</button><button type="button" class="btn sm ghost" data-act="hideInstall">Not now</button></div>':
      '<p>In Chrome, tap ⋮ (top right), then “Install app” or “Add to Home screen”. It opens without internet.</p><button type="button" class="btn sm ghost" data-act="hideInstall">Got it</button>')+'</div></div>';
  }

      '<button type="button" class="btn sm primary" data-act="saveBackup">'+ic('down',16)+'Save backup file</button></div></div>';

function vAaj(){
  if(!S.ready)return loading();
  const t=S.today;
  const ps=people().filter(p=>p.daily!==false).map(p=>({p,s:personToday(p)}));
  const pDone=ps.filter(x=>x.s.k==='got'||x.s.k==='none').length,waiting=ps.length-pDone;
  const fc=S.cases.filter(needsFollow).sort(byCaseUrgency);
  const tk=S.tasks.filter(x=>!x.done&&((isD(x.due)&&x.due<=t)||x.urgent)).sort(byDue);
  const po=S.posts.filter(p=>p.status!=='posted'&&(p.status==='approved'||(isD(p.date)&&p.date<=t))).sort(byPost);
  const doneToday=pDone+S.tasks.filter(x=>x.done&&x.doneOn===t).length+
    S.cases.filter(c=>{const h=c.history||[];return h.length&&h[h.length-1].date===t;}).length+
    S.posts.filter(p=>p.status==='posted'&&p.postedOn===t).length;
  const left=waiting+fc.length+tk.length+po.length,total=doneToday+left,pct=total?Math.round(doneToday*100/total):0;
  const C=2*Math.PI*38,off=C*(1-(total?pct/100:0));
  const sub=left?plural(left,'thing')+(left===1?' needs':' need')+' you today':total?'All done for today. Nice work.':'Nothing due yet. Add updates as they come in.';
  const bm=S.f.bm,bl=currentBulletin(),bName=bm==='bulletin'?'Bulletin':'Report';
  const cell=(to,n,label,tone)=>'<button type="button" class="'+tone+'" data-act="jump" data-to="'+to+'"><b>'+n+'</b><span>'+esc(label)+'</span></button>';

  let h='<section class="hero"><div class="hero-top"><div><p class="hero-eyebrow">'+esc(dayLong(t))+'</p><h1 class="hero-title">'+esc(greeting())+'</h1><p class="hero-sub">'+esc(sub)+'</p></div>'+
    '<div class="ring" role="img" aria-label="'+pct+'% of today done"><svg viewBox="0 0 88 88"><circle class="trk" cx="44" cy="44" r="38"/><circle class="arc" cx="44" cy="44" r="38" stroke-dasharray="'+C.toFixed(2)+'" stroke-dashoffset="'+off.toFixed(2)+'" style="--c:'+C.toFixed(2)+'"/></svg>'+
    '<span class="ring-c"><b>'+(total?pct+'%':'—')+'</b><span>done</span></span></div></div>'+
    '<div class="hero-stats">'+cell('sec-people',waiting,'Check‑ins left',waiting?'warm':'calm')+cell('sec-atr',fc.length,'Follow‑ups',fc.length?'hot':'calm')+
    cell('sec-tasks',tk.length,'Tasks due',tk.length?'warm':'calm')+cell('sec-posts',po.length,'Posts ready',po.length?'warm':'calm')+'</div></section>';
  h+=startCards();

  h+='<section class="sec" id="sec-people"><div class="sec-h"><h2>Daily check-ins</h2><span class="meta">'+pDone+' of '+ps.length+'</span></div>';
  if(ps.length){
    h+='<div class="people">'+ps.map(({p,s})=>{const k=hue(p.id);
      return '<button type="button" class="person '+s.k+'" data-act="person" data-id="'+esc(p.id)+'" aria-label="'+esc(p.name)+': '+esc(s.label)+'">'+
        '<span class="av" style="--s:58px;background:var(--av'+k+'-bg);color:var(--av'+k+'-fg)">'+esc(initials(p.name))+
        (s.k==='pending'?'':'<span class="bd">'+(s.k==='got'?ic('check',12):s.k==='asked'?ic('clock',12):ic('minus',12))+'</span>')+'</span>'+
        '<span class="pname">'+esc(p.name)+'</span><span class="pstat">'+esc(s.label)+'</span></button>';}).join('')+'</div>'+
      '<div class="pbar" aria-hidden="true"><i style="width:'+(ps.length?Math.round(pDone*100/ps.length):0)+'%"></i></div>';
  }else{
    h+=emptyState('users','No people yet','Add the people you collect updates from. They will show up here every day.','<button type="button" class="btn sm primary" data-act="settings">Add people</button>');
  }
  h+='</section>';

  h+='<section class="sec" id="sec-bulletin"><div class="sec-h"><h2>Today’s '+bName.toLowerCase()+'</h2><div class="seg mini">'+
    '<button type="button" class="seg-b" data-act="setF" data-k="bm" data-v="bulletin" aria-pressed="'+(bm==='bulletin')+'">Bulletin</button>'+
    '<button type="button" class="seg-b" data-act="setF" data-k="bm" data-v="report" aria-pressed="'+(bm==='report')+'">Report</button></div></div>'+
    (bl.length?'<div class="card"><div class="list">'+bl.map(bullRow).join('')+'</div><div class="card-foot"><button type="button" class="btn sm primary grow" data-act="copyBull">'+ic('copy',16)+'Copy list</button><button type="button" class="btn sm tonal grow" data-act="markUsed">'+ic('send',16)+'Mark all sent</button></div></div>':
      emptyState('send','Nothing for the '+bName.toLowerCase()+' yet','Pick “'+bName+'” when you add an update and it lands here, numbered and ready to copy.'))+'</section>';

  h+='<section class="sec" id="sec-atr"><div class="sec-h"><h2>ATR follow-ups</h2><span class="meta">'+fc.length+'</span></div>'+
    (fc.length?'<div class="stack">'+fc.map(caseCard).join('')+'</div>':miniEmpty('No case needs a follow-up today.'))+'</section>';

  h+='<section class="sec" id="sec-tasks"><div class="sec-h"><h2>Tasks</h2><span class="meta">'+tk.length+'</span></div>'+
    (tk.length?'<div class="card list">'+tk.map(taskRow).join('')+'</div>':miniEmpty('Nothing due today. Late and urgent tasks show up here.'))+'</section>';

    (po.length?'<div class="stack">'+po.map(postCard).join('')+'</div>':miniEmpty('No posts due today.'))+'</section>';
  return h;
}

/* ---------- other tabs ---------- */
function vUpdates(){
  if(!S.ready)return loading();
  const f=S.f.u,q=S.f.uq.trim().toLowerCase();
  const opts=[['all','All']].concat(destOptions());
  let list=S.updates.filter(u=>f==='all'||(u.dest||[]).includes(f));
  if(q)list=list.filter(u=>(String(u.text||'')+' '+personName(u.from,u.fromName)).toLowerCase().includes(q));

(function(){

async function write(fn){

  try{return await fn();}

function backupObj(){

const IDRE=/^[A-Za-z0-9_\-.~:@+]{1,200}$/;
function parseBackup(raw){
  let o;try{o=JSON.parse(raw);}catch(e){return{err:'This isn’t a valid backup. Make sure the whole text or file was copied.'};}
  if(!o||typeof o!=='object'||Array.isArray(o))return{err:'This isn’t a valid backup.'};
  const okId=s=>typeof s==='string'&&IDRE.test(s)&&s!=='.'&&s!=='..';
  const entries=[],counts={};
  ['cases','updates','posts','tasks','checkins'].forEach(c=>{
    let n=0;
    (Array.isArray(o[c])?o[c]:[]).forEach(it=>{if(it&&typeof it==='object'&&okId(it.id)){entries.push([c+'/'+it.id,stripId(it)]);n++;}});
    counts[c]=n;
  });
  counts.people=0;
  if(o.config&&typeof o.config==='object'&&Array.isArray(o.config.people)){
    const ppl=o.config.people.filter(p=>p&&okId(p.id)&&typeof p.name==='string'&&p.name.trim()).map(p=>({id:p.id,name:p.name.trim(),group:GROUPS[p.group]?p.group:'team',daily:p.daily!==false}));
    const hs=Array.isArray(o.config.handles)?o.config.handles.filter(h=>typeof h==='string'&&h.trim()).map(h=>h.trim()):[];
    entries.push(['config/main',{people:ppl,handles:hs,updatedAt:Date.now()}]);
    counts.people=ppl.length;
  }
  if(!entries.length)return{err:'No data found in this backup.'};
  return{entries,counts};
}

const ACTS={
  tab(el){if(S.tab===el.dataset.tab){window.scrollTo({top:0,behavior:reduced()?'auto':'smooth'});return;}S.tab=el.dataset.tab;S.anim=true;LS.set('tab',S.tab);window.scrollTo(0,0);buzz(5);render();},
  setF(el){S.f[el.dataset.k]=el.dataset.v;saveF();render();},
  toggleShow(el){S.f[el.dataset.k]=!S.f[el.dataset.k];render();},

  settings(){openSettings();},
  close(){closeSheet();},
  reload(){location.reload();},
  undo(){const f=undoFn;undoFn=null;$('#toast').classList.remove('show');if(f)f();},
  hideInstall(){LS.set('hideInstall',true);render();},
  setTheme(el){LS.set('theme',el.dataset.v);applyTheme();$$('#sheet [data-act="setTheme"]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));},
  async install(){
    if(!installEvt){toast('In Chrome, tap ⋮ (top right), then “Install app”.');return;}

  },

  },
  pickN(el){el.setAttribute('aria-pressed',String(el.getAttribute('aria-pressed')!=='true'));},
  due(el){const n=el.dataset.n;$('#f-tdue').value=n==='x'?'':addDays(S.today,+n);},
  person(el){openPerson(el.dataset.id);},
  pAdd(el){openNew('update',{from:el.dataset.id});},

    toast(p?(el.dataset.v==='asked'?p.name+': asked':el.dataset.v==='none'?p.name+': nothing today':p.name+': back to pending'):'Saved');},
  editUpdate(el){openEdit('update',el.dataset.id);},
  editCase(el){openEdit('case',el.dataset.id);},
  editPost(el){openEdit('post',el.dataset.id);},
  editTask(el){openEdit('task',el.dataset.id);},
  copyBull(){copyText(bulletinText(),'List copied. Paste it into Claude to draft the bulletin.');},
  copyField(el){const t=document.getElementById(el.dataset.target);copyText(t?t.value:'','Text copied');},
  copyPost(el){const p=S.posts.find(x=>x.id===el.dataset.id);if(p)copyText(p.text||'','@'+p.handle+' post copied');},
  saveBackup(){
    if(!db){toastBad('Nothing to back up: storage isn’t available.');return;}
    const blob=new Blob([JSON.stringify(backupObj(),null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-work-desk-backup-'+S.today+'.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
    markBackup();buzz(10);toast('Backup file saved. Find it in your Downloads.');
  },
  async copyBackup(){if(!db)return;const ok=await copyText(JSON.stringify(backupObj()),'Backup copied. Paste it somewhere safe.');if(ok)markBackup();},
  openImport(){openImport();},
  impCheck(){const raw=importRaw||val('f-imptext');if(!raw){toastBad('Pick a file or paste the backup text first');return;}showImportPreview(raw);},
  async impDo(el){
    if(!pendingImport)return;
    const entries=pendingImport.entries;el.disabled=true;
    try{await write(()=>db.bulk(entries));buzz(12);closeSheet();toast('Import done');pendingImport=null;importRaw='';}
    catch(e){if(el.isConnected)el.disabled=false;}
  },
  async markUsed(el){
    const items=currentBulletin().filter(u=>u.status!=='used');
    if(!items.length){toast('Everything here is already marked sent');return;}
    el.disabled=true;const now=Date.now();
    try{
      await write(()=>db.bulk(items.map(u=>['updates/'+u.id,Object.assign(stripId(u),{status:'used',updatedAt:now})])));buzz(10);
      toast(plural(items.length,'item')+' marked sent',{undo:()=>write(()=>db.bulk(items.map(u=>['updates/'+u.id,stripId(u)]))).catch(()=>{})});
    }catch(e){if(el.isConnected)el.disabled=false;}
  },
  async quickFollow(el){
    const c=S.cases.find(x=>x.id===el.dataset.id);if(!c)return;
    const t=S.today,next=addDays(t,7),prev=stripId(c);el.disabled=true;
    try{await write(()=>db.doc('cases/'+c.id).update({history:(c.history||[]).concat([{date:t,note:'Followed up'}]),nextFollowup:next,updatedAt:Date.now()}));buzz(10);
      toast('Logged. Next follow-up '+fmtD(next),{undo:()=>write(()=>db.doc('cases/'+c.id).set(prev)).catch(()=>{})});}
    catch(e){if(el.isConnected)el.disabled=false;}
  },
  toggleTask(el){
    const x=S.tasks.find(t=>t.id===el.dataset.id);if(!x||el.dataset.busy)return;
    const done=!x.done,id=x.id;el.dataset.busy='1';el.setAttribute('aria-pressed',String(done));buzz(done?12:6);
    const row=el.closest('.trow');if(row&&done)row.classList.add('leaving');
    setTimeout(async()=>{
      try{await write(()=>db.doc('tasks/'+id).update({done,doneOn:done?S.today:'',updatedAt:Date.now()}));
        if(done)toast('Task done',{undo:()=>write(()=>db.doc('tasks/'+id).update({done:false,doneOn:'',updatedAt:Date.now()})).catch(()=>{})});}
      catch(e){if(el.isConnected){el.setAttribute('aria-pressed',String(!done));delete el.dataset.busy;if(row)row.classList.remove('leaving');}}
    },reduced()?0:320);
  },
  async del(el){
    const col=el.dataset.col,id=el.dataset.id,item=(S[col]||[]).find(x=>x.id===id);if(!item)return;
    const copy=stripId(item);el.disabled=true;
    try{await write(()=>db.doc(col+'/'+id).delete());buzz(14);closeSheet();
      toast((COLNAME[col]||'Item')+' deleted',{undo:()=>write(()=>db.doc(col+'/'+id).set(copy)).then(()=>toast('Restored')).catch(()=>{})});}
    catch(e){if(el.isConnected)el.disabled=false;}
  },
  async addHist(el){
    const c=S.cases.find(x=>x.id===el.dataset.id);if(!c)return;
    const note=val('f-hnote')||'Followed up',t=S.today,next=addDays(t,7),entry={date:t,note};
    el.disabled=true;
    try{
      await write(()=>db.doc('cases/'+c.id).update({history:(c.history||[]).concat([entry]),nextFollowup:next,updatedAt:Date.now()}));buzz(8);
      const hn=$('#f-hnote');if(hn)hn.value='';
      const nx=$('#f-next');if(nx)nx.value=next;
      const he=$('#histEmpty');if(he)he.remove();
      const L=$('#histList');if(L)L.insertAdjacentHTML('afterbegin',histLi(entry));
      toast('Logged. Next follow-up '+fmtD(next));
    }catch(e){}
    if(el.isConnected)el.disabled=false;
  },
  async saveUpdate(el){
    const id=el.dataset.id,from=pickVal('from'),text=val('f-text');
    if(!from){toastBad('Choose who it’s from');return;}
    if(from==='other'&&!val('f-fromname')){bad('f-fromname','Enter a name');return;}
    if(!text){bad('f-text','Write the update');return;}
    let dest=pickVals('dest');if(!dest.length)dest=['record'];
    const date=val('f-date')||S.today,now=Date.now();
    const fromName=from==='other'?val('f-fromname'):from==='self'?'Me':((people().find(p=>p.id===from)||{}).name||'');
    if(id){
      await saving(el,()=>db.doc('updates/'+id).update({from,fromName,text,dest,date,status:pickVal('ustatus')||'new',updatedAt:now}),'Update saved');
      return;
    }
    const ref=db?db.collection('updates').doc():null;
    const ok=await saving(el,()=>ref.set({from,fromName,text,dest,date,status:'new',createdAt:now,updatedAt:now}));
    if(!ok)return;
    const made=[];
    for(const d of dest){
      try{
        if(d.startsWith('post:')){const r=db.collection('posts').doc();await write(()=>r.set({handle:d.slice(5),status:'idea',text,date:'',link:'',sourceUpdate:ref.id,createdAt:now,updatedAt:now}));made.push(d.slice(5)+' post idea');}
        else if(d==='task'){const r=db.collection('tasks').doc();await write(()=>r.set({title:text,from,category:'office',due:'',urgent:false,notes:'',done:false,doneOn:'',sourceUpdate:ref.id,createdAt:now,updatedAt:now}));made.push('task');}
      }catch(e){}
    }
    toast('Update saved'+(made.length?' + '+made.join(', ')+' created':''));
  },
  async saveCase(el){
    const id=el.dataset.id;
    const v={caseNo:val('f-caseno'),title:val('f-title'),authority:val('f-auth'),place:val('f-place'),filedOn:val('f-filed'),
      atrStatus:pickVal('atr')||'awaited',atrDue:val('f-due'),nextFollowup:val('f-next'),atrReceivedOn:val('f-recv'),notes:val('f-notes'),updatedAt:Date.now()};
    if(!v.caseNo&&!v.title){bad('f-title','Enter a case no. or subject');return;}
    if(v.atrStatus==='received'&&!v.atrReceivedOn)v.atrReceivedOn=S.today;
    const cl=$('#f-closed');if(cl)v.closed=cl.checked;
    if(id){await saving(el,()=>db.doc('cases/'+id).update(v),'Case saved');return;}
    const ref=db?db.collection('cases').doc():null;
    await saving(el,()=>ref.set(Object.assign(v,{closed:false,history:[],createdAt:Date.now()})),'Case added');
  },
  async savePost(el){
    const id=el.dataset.id,old=id?(S.posts.find(p=>p.id===id)||{}):{};
    const t=$('#f-ptext');
    const v={handle:pickVal('handle')||handles()[0]||'',status:pickVal('pstatus')||'draft',date:val('f-pdate'),text:t?t.value.trim():'',link:val('f-plink'),updatedAt:Date.now()};
    if(!v.handle){toastBad('Add a social media handle in Settings first');return;}
    if(!v.text){bad('f-ptext','Write the post text');return;}
    if(v.status==='posted'&&!old.postedOn)v.postedOn=S.today;
    if(id){await saving(el,()=>db.doc('posts/'+id).update(v),'Post saved');return;}
    const ref=db?db.collection('posts').doc():null;
    await saving(el,()=>ref.set(Object.assign(v,{createdAt:Date.now()})),'Post added');
  },
  async saveTask(el){
    const id=el.dataset.id,old=id?(S.tasks.find(x=>x.id===id)||{}):{};
    const v={title:val('f-ttitle'),from:pickVal('tfrom')||'self',category:pickVal('tcat')||'office',due:val('f-tdue'),urgent:!!($('#f-turgent')||{}).checked,notes:val('f-tnotes'),updatedAt:Date.now()};
    if(!v.title){bad('f-ttitle','Write the task');return;}
    const dn=$('#f-tdone');
    if(dn){v.done=dn.checked;v.doneOn=dn.checked?(old.done&&old.doneOn?old.doneOn:S.today):'';}
    if(id){await saving(el,()=>db.doc('tasks/'+id).update(v),'Task saved');return;}
    const ref=db?db.collection('tasks').doc():null;
    await saving(el,()=>ref.set(Object.assign(v,{done:false,doneOn:'',createdAt:Date.now()})),'Task added');
  },
  addPpl(){
    const p={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:'',group:'team',daily:true};
    $('#pplRows').insertAdjacentHTML('beforeend',pplRow(p));
    const n=document.getElementById('pn-'+p.id);if(n)n.focus();
  },
  rmPpl(el){const r=el.closest('.pplrow');if(r)r.remove();},
  async saveSettings(el){
    const ppl=$$('#pplRows .pplrow').map(r=>({id:r.dataset.pid,name:String($('[data-f="name"]',r).value||'').trim(),group:$('[data-f="group"]',r).value,daily:$('[data-f="daily"]',r).checked})).filter(p=>p.name);
    const hs=Array.from(new Set(val('f-handles').split(',').map(s=>s.trim().replace(/^@/,'')).filter(Boolean)));
    await saving(el,()=>db.doc('config/main').set({people:ppl,handles:hs,updatedAt:Date.now()}),'Settings saved');
  }
};

  if(t.dataset&&t.dataset.inp){S.f[t.dataset.inp]=t.value;render();}
  if(t.id==='f-ptext')updCount();
  if(t.id==='f-imptext')importRaw='';
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-impfile'&&t.files&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{importRaw=String(r.result||'');showImportPreview(importRaw);};
    r.onerror=()=>toastBad('Couldn’t read that file. Try again.');
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetWrap').hidden)closeSheet();});
let lastY=0;
window.addEventListener('scroll',()=>{
  const y=window.scrollY;$('#appbar').classList.toggle('scrolled',y>12);
  const fab=$('#fab');if(y>lastY+6&&y>120)fab.classList.add('mini');else if(y<lastY-6||y<60)fab.classList.remove('mini');
  lastY=y;
},{passive:true});
function checkDay(){const t=todayStr();if(t!==S.today){S.today=t;S.checkin={};if(db)subCheckin();render();}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDay();render();}});
setInterval(checkDay,60000);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render();});
window.addEventListener('appinstalled',()=>{installEvt=null;toast('App installed');render();});

/* ---------- offline support ---------- */
if('serviceWorker' in navigator&&location.protocol!=='file:'){
  const hadController=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)$('#updBar').hidden=false;});
}

/* ---------- data ---------- */
const docs=s=>s.docs.map(d=>Object.assign({id:d.id},d.data()));
const NEED=['cases','updates','posts','tasks','config'];
function mark(k){S.loaded[k]=true;if(!S.ready&&NEED.every(x=>S.loaded[x]))S.ready=true;render();}
let unCheck=null;
function subCheckin(){
  if(unCheck)unCheck();
  const t=S.today;
  unCheck=db.doc('checkins/'+t).onSnapshot(d=>{if(t!==S.today)return;S.checkin=d.exists?d.data():{};render();});
}
async function boot(){
  applyTheme();
  $('#setBtn').innerHTML=ic('sliders',22);
  render();
  try{await LocalDB.init();db=LocalDB;}catch(e){db=null;}
  if(!db){
    banner('This phone’s storage isn’t available, so entries won’t be saved. Open the app in Chrome, not in an incognito tab.');
    S.ready=true;render();return;
  }
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  db.collection('cases').onSnapshot(s=>{S.cases=docs(s);mark('cases');});
  db.collection('updates').orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{S.updates=docs(s);mark('updates');});
  db.collection('posts').onSnapshot(s=>{S.posts=docs(s);mark('posts');});
  db.collection('tasks').onSnapshot(s=>{S.tasks=docs(s);mark('tasks');});
  db.doc('config/main').onSnapshot(d=>{S.config=d.exists?d.data():null;mark('config');});
  db.doc('meta/backup').onSnapshot(d=>{S.lastBackup=d.exists?d.data().at:'';render();});
  subCheckin();
}
boot();
})();
</script>
</body>
</html>
